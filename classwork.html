<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>.</title>
  <style>
    :root {
      --bg-color: #fdfbff;
      --card-color: #ffffff;
      --text-color: #333;
      --hover-color: #f0e9ff;
      --high: #ffb3b3;
      --medium: #ffe0b3;
      --low: #d4ffb3;
    }

    body.dark {
      --bg-color: #121212;
      --card-color: #1e1e1e;
      --text-color: #eee;
      --hover-color: #2c2c2c;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 30px 10px;
      transition: 0.3s;
    }

    .container {
      background-color: var(--card-color);
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 700px;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    .dark-toggle {
      float: right;
      cursor: pointer;
      margin-bottom: 10px;
      font-size: 20px;
    }

    .input-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 15px;
    }

    input[type="text"], input[type="date"], select {
      flex: 1;
      padding: 10px;
      border: 2px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    #addBtn {
      padding: 10px 20px;
      border: none;
      background: #7e57c2;
      color: white;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
    }

    #addBtn:hover {
      background: #5e35b1;
    }

    .filters, .stats {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 15px;
    }

    .filters select, .filters input {
      flex: 1;
    }

    .stats {
      justify-content: space-between;
      font-size: 14px;
      color: gray;
    }

    .task-list {
      list-style: none;
      padding: 0;
    }

    .task-list li {
      background-color: var(--card-color);
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 10px;
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      animation: fadeIn 0.4s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .task-info {
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .task-info span {
      font-size: 16px;
    }

    .meta {
      font-size: 12px;
      color: gray;
    }

    input[type="checkbox"] {
      width: 18px;
      height: 18px;
    }

    .done span {
      text-decoration: line-through;
      color: gray;
    }

    .delete-btn {
      background: none;
      border: none;
      color: red;
      cursor: pointer;
      font-size: 16px;
    }

    .clear-all {
      margin-top: 10px;
      background: #e53935;
      color: white;
      padding: 8px;
      border: none;
      border-radius: 6px;
      width: 100%;
      cursor: pointer;
    }

    .clear-all:hover {
      background: #b71c1c;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="dark-toggle" onclick="toggleDarkMode()">🌓</div>
    <h2>📋 Мой список задач</h2>

    <div class="input-group">
      <input type="text" id="taskInput" placeholder="Задача..." />
      <input type="text" id="tagsInput" placeholder="Теги (через запятую)" />
      <input type="date" id="deadlineInput" />
      <select id="priorityInput">
        <option value="high">🔴 Высокий</option>
        <option value="medium">🟠 Средний</option>
        <option value="low">🟢 Низкий</option>
      </select>
      <button id="addBtn">Добавить</button>
    </div>

    <div class="filters">
      <input type="text" id="searchInput" placeholder="Поиск..." />
      <select id="filterStatus">
        <option value="all">Статус</option>
        <option value="done">Выполнено</option>
        <option value="undone">Невыполнено</option>
      </select>
      <select id="filterPriority">
        <option value="all">Приоритет</option>
        <option value="high">Высокий</option>
        <option value="medium">Средний</option>
        <option value="low">Низкий</option>
      </select>
      <select id="filterDate">
        <option value="all">Срок</option>
        <option value="today">Сегодня</option>
        <option value="past">Просроченные</option>
      </select>
    </div>

    <div class="stats" id="stats"></div>

    <ul class="task-list" id="taskList"></ul>
    <button class="clear-all" onclick="clearAll()">🧹 Очистить всё</button>
  </div>

  <script>
    const taskInput = document.getElementById("taskInput");
    const tagsInput = document.getElementById("tagsInput");
    const deadlineInput = document.getElementById("deadlineInput");
    const priorityInput = document.getElementById("priorityInput");
    const taskList = document.getElementById("taskList");
    const searchInput = document.getElementById("searchInput");
    const filterStatus = document.getElementById("filterStatus");
    const filterPriority = document.getElementById("filterPriority");
    const filterDate = document.getElementById("filterDate");
    const stats = document.getElementById("stats");

    let tasks = JSON.parse(localStorage.getItem("tasks") || "[]");

    function toggleDarkMode() {
      document.body.classList.toggle("dark");
    }

    function renderTasks() {
      taskList.innerHTML = "";
      const now = new Date().toISOString().split("T")[0];
      const filtered = tasks.filter(task => {
        const matchesText = task.text.toLowerCase().includes(searchInput.value.toLowerCase());
        const matchesStatus = filterStatus.value === "all" || 
          (filterStatus.value === "done" && task.done) || 
          (filterStatus.value === "undone" && !task.done);
        const matchesPriority = filterPriority.value === "all" || filterPriority.value === task.priority;
        const matchesDate = filterDate.value === "all" ||
          (filterDate.value === "today" && task.deadline === now) ||
          (filterDate.value === "past" && task.deadline < now);
        return matchesText && matchesStatus && matchesPriority && matchesDate;
      });

      filtered.forEach((task, i) => {
        const li = document.createElement("li");
        li.className = task.done ? "done" : "";
        li.style.backgroundColor = getPriorityColor(task.priority);

        li.innerHTML = `
          <input type="checkbox" ${task.done ? "checked" : ""} onchange="toggleDone(${i})" />
          <div class="task-info">
            <span>${task.text}</span>
            <div class="meta">
              📅 ${task.deadline || "Без срока"} | 🏷 ${task.tags.join(", ")} | ⚡ ${task.priority}
            </div>
          </div>
          <button class="delete-btn" onclick="deleteTask(${i})">🗑</button>
        `;
        taskList.appendChild(li);
      });

      updateStats();
      localStorage.setItem("tasks", JSON.stringify(tasks));
    }

    function getPriorityColor(priority) {
      switch (priority) {
        case "high": return "var(--high)";
        case "medium": return "var(--medium)";
        case "low": return "var(--low)";
        default: return "var(--card-color)";
      }
    }

    function addTask() {
      const text = taskInput.value.trim();
      const tags = tagsInput.value.split(",").map(t => t.trim()).filter(Boolean);
      const deadline = deadlineInput.value;
      const priority = priorityInput.value;

      if (!text) return;

      tasks.push({ text, tags, deadline, priority, done: false });
      taskInput.value = "";
      tagsInput.value = "";
      deadlineInput.value = "";

      renderTasks();
    }

    function toggleDone(index) {
      tasks[index].done = !tasks[index].done;
      renderTasks();
    }

    function deleteTask(index) {
      tasks.splice(index, 1);
      renderTasks();
    }

    function clearAll() {
      if (confirm("Очистить все задачи?")) {
        tasks = [];
        renderTasks();
      }
    }

    function updateStats() {
      const total = tasks.length;
      const done = tasks.filter(t => t.done).length;
      const undone = total - done;
      stats.textContent = `Всего: ${total} | Выполнено: ${done} | Осталось: ${undone}`;
    }

    document.getElementById("addBtn").addEventListener("click", addTask);
    searchInput.addEventListener("input", renderTasks);
    filterStatus.addEventListener("change", renderTasks);
    filterPriority.addEventListener("change", renderTasks);
    filterDate.addEventListener("change", renderTasks);

    renderTasks();
  </script>
</body>
</html>
